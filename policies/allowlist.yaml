# Runtime allowlist (Phase 3). Replay checks this before every navigation and act.
# Local mock only. No second Playwright path. No LLM.

origins:
  - http://127.0.0.1
  - http://localhost

# "/" is the shell entry only (exact). Other entries are prefixes.
path_prefixes:
  - /
  - /inquiry
  - /nav
  - /member
  - /static
  - /sub-account
  - /session

allowed_actions:
  - click
  - fill
  - extract
  - wait

denied_actions:
  - download
  - file_upload

# mode: block         -> refuse the step, status failed / irreversible_blocked (Phase 3 default)
# mode: require_human -> hand the live session to an operator, status escalated
#                        / irreversible_blocked. Automation never performs the click.
irreversible:
  mode: block
  control_names:
    - Confirm open
  risk_levels:
    - irreversible
